name: Canopy
options:
  bundleIdPrefix: com.canopy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    # Exact, not `from:`. An open upper bound let xcodebuild resolve a
    # different SwiftTerm on every machine -- 1.13.0 locally via Xcode, 1.15.0
    # via SPM, 1.20.0 in CI -- so the shipped binary embedded a terminal
    # emulator no test had ever run against. Bump this deliberately.
    exactVersion: "1.20.0"

targets:
  Canopy:
    type: application
    platform: macOS
    sources:
      - path: Canopy
        # claude-mem writes <claude-mem-context> markers as CLAUDE.md inside
        # source subdirectories. xcodegen would otherwise sweep them all into
        # the .app's Resources, collide on filename, and fail the archive.
        excludes:
          - "**/CLAUDE.md"
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canopy.app
        PRODUCT_NAME: Canopy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_CFBundleDisplayName: Canopy
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: Canopy/App/Canopy.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: SwiftTerm
    entitlements:
      path: Canopy/App/Canopy.entitlements
      properties:
        com.apple.security.app-sandbox: false

  CanopyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Canopy
    settings:
      base:
        SWIFT_VERSION: "6.0"
